services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: unless-stopped
    env_file: .env
    environment:
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$(cat /run/secrets/db_root_password)\" mysqladmin ping -h localhost -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: unless-stopped
    env_file: .env
    environment:
      - WORDPRESS_DB_HOST=mariadb:3306
    secrets:
      - db_password
      - wp_credentials
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - inception

  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: unless-stopped
    env_file: .env
    ports:
      - "443:443"
    depends_on:
      - wordpress
      - static
      - gitea
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  static:
    build: ./requirements/static
    image: static
    container_name: static
    restart: unless-stopped
    networks:
      - inception

  ftp:
    build: ./requirements/ftp
    image: ftp
    container_name: ftp
    restart: unless-stopped
    env_file: .env
    environment:
      - FTP_USER=${FTP_USER}
      - FTP_PASV_ADDRESS=${FTP_PASV_ADDRESS}
    secrets:
      - ftp_password
    volumes:
      - wordpress_data:/var/www/html
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    networks:
      - inception

  gitea:
    build: ./requirements/gitea
    image: gitea
    container_name: gitea
    restart: unless-stopped
    env_file: .env
    environment:
      - GITEA__app__APP_NAME=${GITEA_APP_NAME}
      - GITEA__server__DOMAIN=${DOMAIN_NAME}
      - GITEA__server__ROOT_URL=https://${DOMAIN_NAME}/gitea/
      - GITEA__server__SERVE_FROM_SUB_PATH=true
      - GITEA__server__PROTOCOL=http
      - GITEA__server__HTTP_PORT=3000
      - GITEA__database__DB_TYPE=sqlite3
    volumes:
      - gitea_data:/data
    networks:
      - inception

  redis:
    build: ./requirements/redis
    image: redis
    container_name: redis
    restart: unless-stopped
    networks:
      - inception

  adminer:
    build: ./requirements/adminer
    image: adminer
    container_name: adminer
    restart: unless-stopped
    depends_on:
      - mariadb
    networks:
      - inception

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/sgil--de/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/sgil--de/data/wordpress
  gitea_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/sgil--de/data/gitea

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_credentials:
    file: ../secrets/credentials.txt
  ftp_password:
    file: ../secrets/ftp_password.txt

networks:
  inception:
    driver: bridge
