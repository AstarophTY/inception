name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck entrypoints
        run: shellcheck -S warning $(git ls-files '*.sh')
      - name: Validate docker-compose.yml
        run: |
          cp -r secrets_examples secrets
          cp srcs/.env.example srcs/.env
          cd srcs && docker compose config -q

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build every image
        run: |
          cp -r secrets_examples secrets
          cp srcs/.env.example srcs/.env
          cd srcs && docker compose build
